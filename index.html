<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1B2A49">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="إعدادية الرياحي">
  <link rel="manifest" href="manifest.json">
  <title>إعدادية الرياحي — بوابة التحضير اليومي للطلاب</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <style>
    :root {
      --navy: #1B2A49;
      --navy-light: #263B66;
      --primary: #1D4ED8;
      --primary-soft: #EFF6FF;
      --gold: #C9A227;
      --gold-soft: #FEF9E7;
      --bg: #F3F6FA;
      --card: #FFFFFF;
      --text: #1E293B;
      --muted: #64748B;
      --border: #E2E8F0;
      --ok-bg: #DCFCE7;
      --ok: #166534;
      --err-bg: #FEE2E2;
      --err: #991B1B;
      --radius: 16px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: 'Cairo', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      direction: rtl;
      min-height: 100vh;
      padding-bottom: env(safe-area-inset-bottom, 24px);
    }

    /* الشريط العلوي الثابت */
    .header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
      color: #fff;
      padding: calc(14px + env(safe-area-inset-top, 0px)) 16px 14px;
      box-shadow: 0 4px 16px rgba(27, 42, 73, 0.18);
    }
    .header-inner {
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-icon {
      width: 42px; height: 42px; border-radius: 12px;
      background: rgba(201, 162, 39, 0.18);
      border: 1.5px solid rgba(201, 162, 39, 0.55);
      display: grid; place-items: center; font-size: 20px; flex-shrink: 0;
    }
    .brand h1 { margin: 0; font-size: 18px; font-weight: 800; line-height: 1.25; }
    .brand-sub { font-size: 13px; color: #CBD5E1; margin-top: 2px; }
    .brand-sub strong { color: #FDE68A; }

    .header-actions { display: flex; align-items: center; gap: 6px; }
    .icon-btn {
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.1);
      color: #fff;
      border-radius: 10px;
      padding: 7px 12px;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: background .2s;
    }
    .icon-btn:hover { background: rgba(255,255,255,0.2); }
    .icon-btn.notify-on { background: rgba(34, 197, 94, 0.22); border-color: rgba(134, 239, 172, 0.5); color: #DCFCE7; }
    .icon-btn.notify-off { background: linear-gradient(135deg, #D97706, #B45309); border-color: transparent; }

    .wrap { max-width: 820px; margin: 0 auto; padding: 16px; }

    /* شاشة اختيار الصف والشعبة */
    .setup-card {
      max-width: 460px;
      margin: 28px auto;
      background: var(--card);
      border-radius: 20px;
      padding: 26px 22px;
      box-shadow: 0 10px 30px rgba(27, 42, 73, 0.08);
      border: 1px solid var(--border);
    }
    .setup-card h2 { margin: 0 0 6px; color: var(--navy); text-align: center; font-size: 21px; }
    .setup-card p { margin: 0 0 20px; color: var(--muted); text-align: center; font-size: 14px; }
    .step-label { font-weight: 700; color: var(--navy); margin: 14px 0 8px; font-size: 15px; display: block; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip-btn {
      flex: 1 1 auto;
      min-width: 72px;
      padding: 10px 14px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      background: #fff;
      color: var(--text);
      font: inherit;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: all .18s;
    }
    .chip-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
      box-shadow: 0 4px 12px rgba(29, 78, 216, 0.25);
    }
    .btn-main {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), #1E3A8A);
      color: #fff;
      font: inherit;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-main:disabled { opacity: 0.5; cursor: not-allowed; }

    /* شريط الفلترة والمعلومات */
    .meta-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .filter-pills { display: flex; gap: 6px; }
    .pill {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--muted);
      padding: 5px 13px;
      border-radius: 999px;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .pill.active { background: var(--navy); color: #fff; border-color: var(--navy); }
    .updated-at { font-size: 12.5px; color: var(--muted); }

    /* بطاقات المواد */
    .grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
    @media (min-width: 720px) { .grid { grid-template-columns: 1fr 1fr; } }

    .subject-card {
      background: var(--card);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      border-top: 4px solid var(--accent, var(--primary));
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.04);
      padding: 16px;
      display: flex;
      flex-direction: column;
      transition: transform .15s, box-shadow .15s;
    }
    .subject-card:hover { box-shadow: 0 8px 22px rgba(15, 23, 42, 0.08); }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 8px;
    }
    .subject-name {
      font-size: 17px;
      font-weight: 800;
      color: var(--navy);
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .badge-new {
      background: #DCFCE7;
      color: #15803D;
      font-size: 11px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 999px;
    }
    .card-time { font-size: 12px; color: var(--muted); white-space: nowrap; }
    .teacher-line { font-size: 13.5px; color: var(--muted); margin-bottom: 10px; }
    .topic-title {
      font-size: 15.5px;
      font-weight: 700;
      color: var(--text);
      background: #F8FAFC;
      border-right: 3px solid var(--accent, var(--primary));
      padding: 8px 10px;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .pages-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .page-box {
      background: #F8FAFC;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 7px 10px;
      font-size: 12.5px;
    }
    .page-box span { display: block; color: var(--muted); font-size: 11.5px; }
    .page-box strong { color: var(--navy); font-size: 13.5px; }

    /* قصّ النص الطويل بأناقة حتى لا تتشوه الصفحة */
    .preview-text {
      font-size: 14px;
      line-height: 1.75;
      color: #334155;
      margin: 4px 0 12px;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }
    .prev-hint {
      font-size: 12.5px;
      color: var(--muted);
      background: #FFFBEB;
      border: 1px dashed #FCD34D;
      border-radius: 8px;
      padding: 6px 10px;
      margin-bottom: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-actions {
      margin-top: auto;
      display: flex;
      gap: 8px;
      padding-top: 8px;
      border-top: 1px solid #F1F5F9;
    }
    .btn-details {
      flex: 1;
      border: none;
      border-radius: 10px;
      padding: 9px 12px;
      font: inherit;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      background: var(--primary-soft);
      color: var(--primary);
    }
    .btn-details:hover { background: #DBEAFE; }
    .btn-prev {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 12px;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      background: #fff;
      color: var(--navy);
    }
    .btn-prev:hover { background: #F8FAFC; }

    /* نافذة التفاصيل الكاملة (Modal) */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(3px);
      z-index: 100;
      display: none;
      align-items: flex-end;
      justify-content: center;
      padding: 0;
    }
    .modal-backdrop.open { display: flex; }
    @media (min-width: 640px) {
      .modal-backdrop { align-items: center; padding: 20px; }
    }
    .modal {
      width: 100%;
      max-width: 640px;
      max-height: 88vh;
      background: #fff;
      border-radius: 22px 22px 0 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.25);
      animation: slideUp .22s ease-out;
    }
    @media (min-width: 640px) { .modal { border-radius: 20px; } }
    @keyframes slideUp { from { transform: translateY(24px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    .modal-head {
      background: var(--navy);
      color: #fff;
      padding: 16px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .modal-head h3 { margin: 0; font-size: 18px; }
    .modal-close {
      background: rgba(255,255,255,0.15);
      border: none;
      color: #fff;
      width: 34px; height: 34px;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
    }
    .modal-tabs {
      display: flex;
      background: #F1F5F9;
      padding: 6px;
      gap: 6px;
      border-bottom: 1px solid var(--border);
    }
    .modal-tab {
      flex: 1;
      border: none;
      background: transparent;
      padding: 8px;
      border-radius: 10px;
      font: inherit;
      font-size: 13.5px;
      font-weight: 700;
      color: var(--muted);
      cursor: pointer;
    }
    .modal-tab.active { background: #fff; color: var(--navy); box-shadow: 0 2px 6px rgba(0,0,0,0.06); }

    .modal-body {
      padding: 18px;
      overflow-y: auto;
      line-height: 1.9;
      font-size: 15px;
    }
    .detail-block {
      background: #F8FAFC;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .detail-block h4 {
      margin: 0 0 8px;
      font-size: 14.5px;
      color: var(--primary);
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px;
    }
    .rich-content { white-space: pre-wrap; word-break: break-word; color: var(--text); }
    .rich-content code { background: #E2E8F0; padding: 1px 6px; border-radius: 5px; font-family: inherit; }
    .rich-content blockquote {
      margin: 8px 0; padding: 8px 12px;
      border-right: 4px solid var(--primary);
      background: #EFF6FF; border-radius: 8px;
    }
    .rich-content a { color: var(--primary); font-weight: 700; }
    .yt-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      background: #FEF2F2; color: #DC2626; border: 1px solid #FECACA;
      text-decoration: none; font-weight: 700; padding: 11px; border-radius: 12px; margin-bottom: 10px;
    }
    .files-note {
      background: var(--gold-soft); color: #854D0E; border: 1px solid #FDE68A;
      padding: 10px 12px; border-radius: 10px; font-size: 13.5px; font-weight: 600;
    }

    .empty-box, .status-msg {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px 18px;
      text-align: center;
      color: var(--muted);
    }
    .status-msg.error { background: var(--err-bg); color: var(--err); border-color: #FECACA; padding: 14px; margin-bottom: 14px; }
    .status-msg.info { background: var(--primary-soft); color: var(--primary); border-color: #BFDBFE; padding: 12px; margin-bottom: 14px; }
    .skeleton {
      height: 180px; border-radius: var(--radius);
      background: linear-gradient(90deg, #E2E8F0 25%, #F1F5F9 50%, #E2E8F0 75%);
      background-size: 200% 100%; animation: shimmer 1.3s infinite;
    }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <div class="brand">
        <div class="brand-icon">🎓</div>
        <div>
          <h1>إعدادية الرياحي</h1>
          <div class="brand-sub" id="header-sub">بوابة التحضير اليومي للطلاب</div>
        </div>
      </div>
      <div class="header-actions hidden" id="header-actions">
        <button type="button" class="icon-btn notify-off" id="btn-notify">🔔 تفعيل الإشعارات</button>
        <button type="button" class="icon-btn" id="btn-refresh" title="تحديث">🔄</button>
        <button type="button" class="icon-btn" id="btn-change" title="تغيير الصف والشعبة">⚙️</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div id="global-msg" class="status-msg hidden"></div>

    <!-- شاشة اختيار الصف والشعبة -->
    <section id="setup-view" class="setup-card hidden">
      <h2>مرحباً بك في إعدادية الرياحي</h2>
      <p>اختر صفّك وشعبتك مرة واحدة فقط لتظهر لك تحاضيرك اليومية تلقائياً</p>

      <label class="step-label">1. اختر الصف</label>
      <div id="class-chips" class="chips"></div>

      <div id="div-section" class="hidden">
        <label class="step-label">2. اختر الشعبة</label>
        <div id="div-chips" class="chips"></div>
      </div>

      <button type="button" class="btn-main" id="btn-save-choice" disabled>عرض التحاضير</button>
    </section>

    <!-- شاشة عرض التحاضير -->
    <section id="feed-view" class="hidden">
      <div class="meta-bar">
        <div class="filter-pills">
          <button type="button" class="pill active" data-filter="all">جميع المواد</button>
          <button type="button" class="pill" data-filter="new">🆕 جديد (آخر 24 ساعة)</button>
        </div>
        <div class="updated-at" id="updated-at"></div>
      </div>
      <div id="feed-grid" class="grid"></div>
    </section>
  </main>

  <!-- نافذة عرض التفاصيل الكاملة -->
  <div class="modal-backdrop" id="modal-backdrop">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <div>
          <h3 id="modal-title"></h3>
          <div id="modal-sub" style="font-size:12.5px;color:#CBD5E1;margin-top:2px"></div>
        </div>
        <button type="button" class="modal-close" id="modal-close">✕</button>
      </div>
      <div class="modal-tabs hidden" id="modal-tabs">
        <button type="button" class="modal-tab active" data-which="latest">📌 التحضير الأحدث</button>
        <button type="button" class="modal-tab" data-which="previous">↩️ التحضير السابق</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

<script>
  // =================================================================
  // إعدادات الربط
  // =================================================================
  const CONFIG = {
    GAS_URL: 'https://script.google.com/macros/s/AKfycbzZPqtdS9kJSe-cTBiISAHN6m-8B6UO3vdFvWQGi7sx81zlwZmuzcUrO29zd5D5Rw3bLQ/exec',
    ONESIGNAL_APP_ID: '649b3d75-0371-4630-8294-0cbd915c454b'
  };

  const ACCENTS = ['#1D4ED8', '#0F766E', '#7C3AED', '#B45309', '#BE123C', '#0369A1', '#047857', '#A21CAF'];
  const STORE_KEY = 'riyahi_student_pref_v1';
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function normId(v) { return String(v || '').trim().toUpperCase(); }
  function normDiv(v) {
    let s = String(v || '').trim().replace(/^شعبة\s+/u, '').trim();
    return s.replace(/^[اأإآ]$/u, 'أ').replace(/^(هـ|ه|ة)$/u, 'هـ');
  }
  function stripHtml(html) {
    const tmp = document.createElement('div');
    tmp.innerHTML = String(html || '');
    return (tmp.textContent || tmp.innerText || '').trim();
  }

  async function apiPost(payload) {
    const res = await fetch(CONFIG.GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    return res.json();
  }

  // =================================================================
  // OneSignal Push (إشعارات والشاشة مغلقة)
  // =================================================================
  let oneSignalReady = false;
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  if (CONFIG.ONESIGNAL_APP_ID && !CONFIG.ONESIGNAL_APP_ID.startsWith('PUT_')) {
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: CONFIG.ONESIGNAL_APP_ID,
        allowLocalhostAsSecureOrigin: true
      });
      oneSignalReady = true;
      updateNotifyBtn(OneSignal.Notifications.permission);
      OneSignal.Notifications.addEventListener('permissionChange', granted => {
        updateNotifyBtn(granted);
        if (granted) syncStudentTags();
      });
      if (OneSignal.Notifications.permission) syncStudentTags();
    });
  }

  function updateNotifyBtn(granted) {
    const btn = $('btn-notify');
    if (granted) {
      btn.textContent = '🔔 الإشعارات مفعّلة';
      btn.classList.remove('notify-off');
      btn.classList.add('notify-on');
    } else {
      btn.textContent = '🔔 تفعيل الإشعارات';
      btn.classList.remove('notify-on');
      btn.classList.add('notify-off');
    }
  }

  function syncStudentTags() {
    const pref = getPref();
    if (!oneSignalReady || !pref) return;
    OneSignalDeferred.push(async function(OneSignal) {
      if (!OneSignal.Notifications.permission) return;
      await OneSignal.User.addTags({
        role: 'student',
        class_id: normId(pref.classId),
        class_div: normId(pref.classId) + '_' + normDiv(pref.division)
      });
    });
  }

  function requestNotifications() {
    if (!oneSignalReady) {
      showMsg('لم يتم ربط خدمة الإشعارات بعد، أو أن المتصفح لا يدعم الإشعارات (على الآيفون: أضف الموقع للشاشة الرئيسية أولاً).', 'info');
      return;
    }
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.Notifications.requestPermission();
      if (OneSignal.Notifications.permission) {
        await syncStudentTags();
        showMsg('تم تفعيل الإشعارات لشعبتك بنجاح! ستصلك التنبيهات فوراً حتى والشاشة مغلقة.', 'info');
        setTimeout(hideMsg, 4500);
      }
    });
  }

  // =================================================================
  // حالة التطبيق
  // =================================================================
  const State = {
    classes: [],
    selectedClass: null,
    selectedDiv: null,
    items: [],
    filter: 'all',
    activeModalItem: null
  };

  function getPref() {
    try { return JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch (e) { return null; }
  }
  function savePref(pref) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(pref)); } catch (e) {}
  }
  function showMsg(text, type) {
    const el = $('global-msg');
    el.textContent = text;
    el.className = 'status-msg ' + (type || 'info');
    el.classList.remove('hidden');
  }
  function hideMsg() { $('global-msg').classList.add('hidden'); }

  async function init() {
    if (!CONFIG.GAS_URL || CONFIG.GAS_URL.startsWith('PUT_')) {
      showMsg('تنبيه للمدير: يرجى وضع رابط Google Apps Script في متغير CONFIG داخل ملف index.html.', 'error');
      return;
    }

    $('btn-notify').addEventListener('click', requestNotifications);
    $('btn-refresh').addEventListener('click', () => loadFeed());
    $('btn-change').addEventListener('click', () => openSetup());
    $('btn-save-choice').addEventListener('click', confirmSetup);
    $('modal-close').addEventListener('click', closeModal);
    $('modal-backdrop').addEventListener('click', e => { if (e.target === $('modal-backdrop')) closeModal(); });
    $('modal-tabs').addEventListener('click', e => {
      const btn = e.target.closest('.modal-tab');
      if (btn) renderModalContent(btn.dataset.which);
    });
    document.querySelectorAll('.pill').forEach(p => p.addEventListener('click', () => {
      document.querySelectorAll('.pill').forEach(x => x.classList.remove('active'));
      p.classList.add('active');
      State.filter = p.dataset.filter;
      renderFeed();
    }));

    const pref = getPref();
    if (pref && pref.classId && pref.division) {
      updateHeader(pref.className, pref.division);
      await loadFeed();
    } else {
      await openSetup();
    }
  }

  function updateHeader(className, division) {
    $('header-sub').innerHTML = `<strong>${esc(className)}</strong> • شعبة <strong>${esc(division)}</strong>`;
    $('header-actions').classList.remove('hidden');
  }

  async function openSetup() {
    $('feed-view').classList.add('hidden');
    $('setup-view').classList.remove('hidden');
    hideMsg();

    if (!State.classes.length) {
      $('class-chips').innerHTML = '<div style="color:#64748B">جاري تحميل الصفوف...</div>';
      try {
        const res = await apiPost({ action: 'studentMeta' });
        if (!res.success) throw new Error(res.message);
        State.classes = res.classes || [];
      } catch (e) {
        showMsg('تعذر الاتصال بالخادم. تأكد من الإنترنت وحاول مرة أخرى.', 'error');
        return;
      }
    }

    const pref = getPref();
    State.selectedClass = pref ? State.classes.find(c => c.classId === pref.classId) || null : null;
    State.selectedDiv = pref ? pref.division : null;
    renderSetupChips();
  }

  function renderSetupChips() {
    $('class-chips').innerHTML = State.classes.map(c =>
      `<button type="button" class="chip-btn ${State.selectedClass && State.selectedClass.classId === c.classId ? 'active' : ''}" data-cid="${esc(c.classId)}">${esc(c.className)}</button>`
    ).join('');

    $('class-chips').querySelectorAll('.chip-btn').forEach(b => b.addEventListener('click', () => {
      State.selectedClass = State.classes.find(c => c.classId === b.dataset.cid);
      State.selectedDiv = null;
      renderSetupChips();
    }));

    if (State.selectedClass) {
      $('div-section').classList.remove('hidden');
      const divs = State.selectedClass.divisions.length ? State.selectedClass.divisions : ['أ', 'ب', 'ج', 'د', 'هـ'];
      $('div-chips').innerHTML = divs.map(d =>
        `<button type="button" class="chip-btn ${State.selectedDiv === d ? 'active' : ''}" data-div="${esc(d)}">شعبة ${esc(d)}</button>`
      ).join('');
      $('div-chips').querySelectorAll('.chip-btn').forEach(b => b.addEventListener('click', () => {
        State.selectedDiv = b.dataset.div;
        renderSetupChips();
      }));
    } else {
      $('div-section').classList.add('hidden');
    }

    $('btn-save-choice').disabled = !(State.selectedClass && State.selectedDiv);
  }

  async function confirmSetup() {
    if (!State.selectedClass || !State.selectedDiv) return;
    const pref = {
      classId: State.selectedClass.classId,
      className: State.selectedClass.className,
      division: State.selectedDiv
    };
    savePref(pref);
    syncStudentTags();
    updateHeader(pref.className, pref.division);
    await loadFeed();
  }

  async function loadFeed() {
    const pref = getPref();
    if (!pref) return openSetup();
    hideMsg();
    $('setup-view').classList.add('hidden');
    $('feed-view').classList.remove('hidden');
    $('feed-grid').innerHTML = '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';

    try {
      const res = await apiPost({ action: 'studentFeed', classId: pref.classId, division: pref.division });
      if (!res.success) throw new Error(res.message);
      State.items = res.items || [];
      $('updated-at').textContent = `آخر تحديث: ${res.updatedAt || ''}`;
      renderFeed();
    } catch (e) {
      $('feed-grid').innerHTML = '';
      showMsg('تعذر تحميل التحاضير: ' + (e.message || 'خطأ في الاتصال'), 'error');
    }
  }

  function renderFeed() {
    const list = State.filter === 'new' ? State.items.filter(x => x.latest.isNew) : State.items;
    if (!list.length) {
      $('feed-grid').innerHTML = `<div class="empty-box" style="grid-column:1/-1">
        <div style="font-size:34px;margin-bottom:8px">📭</div>
        <strong>${State.filter === 'new' ? 'لا توجد تحاضير جديدة خلال آخر 24 ساعة.' : 'لا توجد تحاضير منشورة لهذه الشعبة بعد.'}</strong>
      </div>`;
      return;
    }

    $('feed-grid').innerHTML = list.map((item, idx) => {
      const cur = item.latest;
      const prev = item.previous;
      const accent = ACCENTS[idx % ACCENTS.length];
      const preview = stripHtml(cur.nextLesson || cur.prevLesson);

      return `<article class="subject-card" style="--accent:${accent}">
        <div class="card-top">
          <div class="subject-name">
            <span>📖 ${esc(item.subject)}</span>
            ${cur.isNew ? '<span class="badge-new">جديد</span>' : ''}
          </div>
          <div class="card-time">🕒 ${esc(cur.timeLabel)}</div>
        </div>
        <div class="teacher-line">👨‍🏫 ${esc(cur.teacher)}</div>
        ${cur.topic ? `<div class="topic-title">🔖 ${esc(cur.topic)}</div>` : ''}
        <div class="pages-row">
          <div class="page-box"><span>🔙 المشروح سابقاً</span><strong>${esc(cur.prevPages || '—')}</strong></div>
          <div class="page-box"><span>🔜 القادم (ص)</span><strong>${esc(cur.nextPages || '—')}</strong></div>
        </div>
        ${preview ? `<div class="preview-text">${esc(preview)}</div>` : ''}
        ${prev ? `<div class="prev-hint">↩️ السابق: ${esc(prev.topic || prev.nextPages || prev.timeLabel)}</div>` : ''}
        <div class="card-actions">
          <button type="button" class="btn-details" data-open="${esc(item.subject)}" data-which="latest">📖 عرض التفاصيل الكاملة</button>
          ${prev ? `<button type="button" class="btn-prev" data-open="${esc(item.subject)}" data-which="previous">↩️ السابق</button>` : ''}
        </div>
      </article>`;
    }).join('');

    $('feed-grid').querySelectorAll('[data-open]').forEach(btn => {
      btn.addEventListener('click', () => {
        const item = State.items.find(x => x.subject === btn.dataset.open);
        if (item) openModal(item, btn.dataset.which);
      });
    });
  }

  function openModal(item, which) {
    State.activeModalItem = item;
    $('modal-title').textContent = '📖 ' + item.subject;
    $('modal-tabs').classList.toggle('hidden', !item.previous);
    renderModalContent(which || 'latest');
    $('modal-backdrop').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function renderModalContent(which) {
    const item = State.activeModalItem;
    const data = (which === 'previous' && item.previous) ? item.previous : item.latest;
    document.querySelectorAll('.modal-tab').forEach(t => t.classList.toggle('active', t.dataset.which === which));
    $('modal-sub').textContent = `👨‍🏫 ${data.teacher}  •  🕒 ${data.timeLabel}`;

    let html = '';
    if (data.topic) {
      html += `<div class="detail-block" style="border-right:4px solid #1D4ED8">
        <h4><span>🔖 موضوع المحاضرة القادمة</span><span>الشعب: ${esc(data.divisions)}</span></h4>
        <strong style="font-size:16px">${esc(data.topic)}</strong>
      </div>`;
    }

    html += `<div class="detail-block">
      <h4><span>🔜 المطلوب للمحاضرة القادمة</span><span>📄 الصفحات: ${esc(data.nextPages || '—')}</span></h4>
      <div class="rich-content">${data.nextLesson || '<span style="color:#64748B">لا يوجد نص تفصيلي إضافي (التحضير مسجّل قبل تحديث التفاصيل أو يكتفي بالصفحات).</span>'}</div>
    </div>`;

    html += `<div class="detail-block">
      <h4><span>🔙 ما تم شرحه سابقاً</span><span>📄 الصفحات: ${esc(data.prevPages || '—')}</span></h4>
      <div class="rich-content">${data.prevLesson || '<span style="color:#64748B">—</span>'}</div>
    </div>`;

    if (data.youtubeLink) {
      html += `<a class="yt-btn" href="${esc(data.youtubeLink)}" target="_blank" rel="noopener">▶️ مشاهدة فيديو اليوتيوب الداعم</a>`;
    }
    if (data.filesCount > 0) {
      html += `<div class="files-note">📎 يوجد (${data.filesCount}) ملف/مرفق لهذا التحضير — يمكنك تنزيلها من قناة الصف على التليجرام.</div>`;
    }

    $('modal-body').innerHTML = html;
  }

  function closeModal() {
    $('modal-backdrop').classList.remove('open');
    document.body.style.overflow = '';
  }

  init();
</script>
</body>
</html>
